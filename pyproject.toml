[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "high-load-system-template"
version = "0.1.0"
description = "Production-ready high-load AI microservice template."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "httpx>=0.28.0",
  "tenacity>=9.0.0",
  "langgraph>=0.2.53",
  "langchain-core>=0.3.18",
  "langchain>=0.3.9",
  "langchain-openai>=0.2.8",
  "langfuse>=2.57.0",
  "sse-starlette>=2.1.3",
  "orjson>=3.10.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "fakeredis[lua]>=2.23.0",
  "mypy>=1.13.0",
  "ruff>=0.8.0",
  "locust>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/high_load_ai"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["high_load_ai"]
warn_unused_configs = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"src/high_load_ai/api/dependencies.py" = ["B008"]
"src/high_load_ai/api/routers/runs.py" = ["B008"]
"tests/load/locustfile.py" = ["I001"]
